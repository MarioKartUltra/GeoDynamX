[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geodynamix-beta"          # GeoDynamix_Beta: its own distribution (the import package stays `dynamix`)
version = "0.1.0.dev0"
description = "A multiscale structure instrument: WTMM analysis over rasters, layers as device chains, results on a WGS84 globe"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-2.0-or-later AND GPL-2.0-only" }   # see NOTICE: xsmurf-derived files are GPL-2.0-only
authors = [{ name = "Abraham Joseph Okayli Masaryk", email = "ajokaylimasaryk@uh.edu" }]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

# numpy is the ONLY hard dependency. Every other third-party import in dynamix/core is lazy or
# guarded, so the analysis core installs and imports with numpy alone — verified by
# tests/test_manifest_matches_imports.py, which derives this list from the AST rather than trusting
# it. (EQSelect's requirements.txt drifted out of sync with its own imports; that is the failure
# this test exists to prevent.)
dependencies = [
    "numpy>=2.0",
    # The FFT engines ARE the install-time switch
    # (dynamix.core.fft_policy) -- FFTW3 on every platform, mlx ONLY on Apple Silicon, so a
    # Windows/Linux/Intel-Mac install never tries to install mlx and runs every FFT on FFTW3.
    "pyfftw>=0.14",
    "mlx>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
# CPU acceleration. numba JIT-compiles the maxima-line walk kernels lazily with cache=True; without
# it they run as pure Python and are far slower, so this is "optional" only in the import sense.
# PyWavelets: the orthogonal pyramids of dwt2d and the inpainting engine (lazy import).
fast = ["numba>=0.60", "scipy>=1.11", "PyWavelets>=1.8"]

# FFTW3 CPU backend — the portable fast path in the CWT cascade.
fftw = ["pyfftw>=0.14"]

# Apple Silicon GPU backend (Metal). The primary path on the only platform currently targeted.
mac = ["mlx>=0.20"]

# Raster and image loading: GeoTIFF windowing/tiling, plain images for lab-frame maps.
# rasterio <1.5.2: 1.5.2 ships no macOS 14 arm64 wheel, so pip builds it from source and a machine
# without GDAL (a CI runner, a user's laptop) fails; 1.5.1 has wheels on every target. Raise the
# ceiling when a release restores the wheel.
io = ["rasterio>=1.4,<1.5.2", "Pillow>=10"]

# HDF4 (ASTER-class HDF-EOS2) via pyhdf, lazily imported by core/ingest and roi/picture.
# <0.11.7: that release's macOS wheels are tagged macosx_26_0, so on older macOS pip skips
# them and falls back to the sdist, which compiles libhdf4 at install time. 0.11.6 ships
# macosx_14_0 arm64 + win_amd64 wheels (a macOS wheel tag is a MINIMUM, so it installs on
# every newer macOS too). Raise the ceiling when a release restores lower tags.
hdf4 = ["pyhdf>=0.11.6,<0.11.7"]

# The arrangement (session/arrangement Tab-flip) view: a VTK surface via pyvista/pyvistaqt.
# Lazily imported behind dynamix.shell.arrangement.view._import_pyvista -- absent, the Tab flip
# degrades to a notice instead of failing to import.
viz = ["pyvista>=0.44", "pyvistaqt>=0.11"]

# The shell. Declared now that `dynamix/shell/` exists and imports these; it did not before, and
# an extra that installs nothing is worse than an honest absence. matplotlib is already on disk as
# a transitive pyvista dependency, but right_panel.py's colormap-ramp icons import it directly, so it earns its own explicit declaration rather than riding pyvista's
# coattails undeclared.
gui = ["PySide6>=6.5", "pyqtgraph>=0.13", "matplotlib>=3.8"]

# pytest-qt for the shell test suite; ipython for `python -m dynamix.devloop --ipython`
# (%gui qt + %autoreload 2, guarded — devloop.py prints a clear message and exits if it's absent).
dev = ["pytest>=8", "pytest-qt", "ipython", "import-linter>=2.0"]

# No [cuda] extra: CUDA is deferred, and declaring one that installs nothing would be a lie in the
# packaging metadata.

# Data-source catalog tooling (catalog/tools/build.py). Not imported by dynamix itself.
catalog = ["pyyaml>=6.0"]

# GeoDynamix_Beta: everything the app needs, in one extra -- `pip install -e ".[app]"`.
app = ["numba>=0.60", "scipy>=1.11", "PyWavelets>=1.8", "rasterio>=1.4,<1.5.2", "Pillow>=10", "PySide6>=6.5",
       "pyqtgraph>=0.13", "matplotlib>=3.8", "pyvista>=0.44", "pyvistaqt>=0.11",
       "pyhdf>=0.11.6,<0.11.7"]   # same pin as the hdf4 extra, for the same reason

# The vendored `wtmm` package's own optional features (its NN and dataset helpers), lazily
# imported and never used by the app -- declared honestly, installed only on request.
wtmm-extras = ["torch", "pandas", "joblib"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pyvista: builds a pyvista scene; pyvista's teardown segfaults offscreen on some machines, so these run only in the allowed-to-fail CI job",
]

# The layering gate (`lint-imports`, run by CI): the layer order the code has, no Qt below the shell,
# no geopandas/shapely outside a GeoPackage export module, the vendored packages reached only from core.
# Every ignore is a lazy import kept on purpose, with its reason.
[tool.importlinter]
root_package = "dynamix"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: shell over devices over engine over geo, roi, model, topology, core"
type = "layers"
layers = [
    "dynamix.shell",
    "dynamix.devices",
    "dynamix.engine",
    "dynamix.geo",
    "dynamix.roi",
    "dynamix.model",
    "dynamix.topology",
    "dynamix.core",
]
ignore_imports = [
    # engine resolves one filter by name; the registry lookup belongs one layer up (a later spec)
    "dynamix.engine.resolve -> dynamix.devices.filters",
    # core.bus reads pictures and HDF4 through roi helpers; moving them into core is a later spec
    "dynamix.core.bus -> dynamix.roi.picture",
    "dynamix.core.bus -> dynamix.roi.runner",
    # the device registry lookup belongs one layer up (a later spec)
    "dynamix.core.wavelet_profiles -> dynamix.model.device",
    # inpainting asks geo whether a field is georeferenced; a core-level predicate is a later spec
    "dynamix.core.inpaint.grid -> dynamix.geo.mapping",
]

[[tool.importlinter.contracts]]
name = "No Qt, pyvista or pyqtgraph below the shell"
type = "forbidden"
source_modules = [
    "dynamix.core", "dynamix.devices", "dynamix.engine", "dynamix.model", "dynamix.roi", "dynamix.geo",
    "dynamix.topology",
]
forbidden_modules = ["PySide6", "pyvista", "pyvistaqt", "pyqtgraph"]

[[tool.importlinter.contracts]]
name = "geopandas and shapely only in a GeoPackage export module"
type = "forbidden"
source_modules = ["dynamix"]
forbidden_modules = ["geopandas", "shapely"]

[[tool.importlinter.contracts]]
name = "The vendored packages are imported only by core, lazily"
type = "forbidden"
source_modules = [
    "dynamix.shell", "dynamix.devices", "dynamix.engine", "dynamix.model", "dynamix.roi", "dynamix.geo",
    "dynamix.topology",
]
forbidden_modules = ["dynamix._vendor"]
# direct imports only: every layer reaches the vendored code through core's lazy imports, by design
allow_indirect_imports = true
ignore_imports = [
    # the chain-filter devices call the vendored OLS Holder and length filters directly (spec 09 ports them)
    "dynamix.devices.chain_filters -> dynamix._vendor.wtmm_ebsd.chain_filters",
]

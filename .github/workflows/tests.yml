# The two test gates on the three targets: the mlx engine on Apple Silicon (macos-14 runners are
# arm64), FFTW3 on Windows and on Linux. The gates are the ones docs describe for a developer's
# machine: the headless set (no Qt) and the Qt-only set under the offscreen platform, both without the
# scene tests (the `pyvista` marker), which run in their own job allowed to fail because pyvista's
# teardown segfaults on some machines.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "run every test instead of the tests the changed code reaches"
        type: boolean
        default: false
  schedule:
    - cron: "0 9 * * 1"       # a full run every Monday, 09:00 UTC, so the selection never drifts for long

permissions:
  contents: read

jobs:
  gates:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    env:
      PYTHONNOUSERSITE: "1"
      QT_QPA_PLATFORM: offscreen
      # FFTW plans by estimate on the runners: pyfftw's default FFTW_MEASURE timed one M-Z reconstruction
      # test's plans for over five minutes on Windows and the headless gate past its limit. The engine
      # records the planner in every result, and the backends agree to float32 tolerance either way.
      PYFFTW_PLANNER_EFFORT: FFTW_ESTIMATE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Software OpenGL for VTK on Windows (Mesa3D)
        # GitHub's Windows runners have no GPU driver: a VTK render window crashed with an access
        # violation. The action installs Mesa's off-screen renderer and points VTK at it.
        if: runner.os == 'Windows'
        uses: pyvista/setup-headless-display-action@v5
      - name: Linux libraries Qt and VTK load even offscreen
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libglib2.0-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xkb1 libxcb-render-util0 libxcb-image0
      - name: Fonts for the offscreen platform on Windows
        # Offscreen on Windows reads its fonts from a directory, and the PySide6 wheel ships none:
        # no font was found (QFontInfo gave '' at -1 px) and text measured in missing-glyph boxes,
        # about twice its width.
        if: runner.os == 'Windows'
        run: echo 'QT_QPA_FONTDIR=C:\Windows\Fonts' >> "$GITHUB_ENV"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[fast,io,app,dev]"
      - name: Engine in use
        run: python -c "from dynamix.core import fft_policy as p; print(p.resolve())"
      # Selective runs: pytest-testmon records which source lines each test executed in .testmondata
      # and reruns only the tests whose code changed since. The database is cached per platform
      # across runs (restore the latest, save under this commit); without one the run is full and
      # records. A manual run with "full" ticked and the Monday schedule run everything. A numba
      # kernel's body and a golden data file are outside testmon's view, which the weekly run covers.
      - name: Restore the test selection database (testmon)
        if: ${{ github.event_name != 'schedule' && inputs.full != true }}
        uses: actions/cache/restore@v4
        with:
          path: .testmondata
          key: testmon-${{ runner.os }}-${{ github.sha }}
          restore-keys: testmon-${{ runner.os }}-
      - name: Choose the selection
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.full }}" = "true" ]; then
            echo "SELECT=" >> "$GITHUB_ENV"; echo "full run"
          else
            echo "SELECT=--testmon" >> "$GITHUB_ENV"; echo "testmon selection"
          fi
      # A file is Qt when it mentions QtWidgets or qtbot. The pyvista scene tests are left out by
      # tests/conftest.py (they run only under DYNAMIX_PYVISTA=1), never by a text match or a -m
      # expression, which would switch testmon's selection off.
      - name: Select the gates' files (each list must be non-empty)
        run: |
          grep -L "QtWidgets\|qtbot" tests/test_*.py > headless.txt || true
          grep -l "QtWidgets\|qtbot" tests/test_*.py > qtonly.txt || true
          echo "headless files: $(wc -l < headless.txt)   qt-only files: $(wc -l < qtonly.txt)"
          test -s headless.txt && test -s qtonly.txt
      - name: Style report (spec 10; findings for review, never failing)
        if: runner.os == 'Linux'
        run: |
          python tools/lint_markers.py --all
          python -m pip install -q "ruff>=0.6"
          echo "## ruff" >> "$GITHUB_STEP_SUMMARY"
          # the summary takes 1 MB at most: the first 150 findings and the format check's count
          ruff check --exit-zero --output-format concise src tools > ruff.txt
          head -150 ruff.txt >> "$GITHUB_STEP_SUMMARY"; tail -3 ruff.txt
          ruff format --check src tools 2>&1 | tail -3 >> "$GITHUB_STEP_SUMMARY" || true
      # Each gate reports whatever the other did, within its own time limit, so the job's limit never
      # swallows a log; a test that hangs past faulthandler_timeout prints its stack, naming it.
      - name: Headless gate
        timeout-minutes: 30
        # pytest exits 5 when the selection is empty: with testmon that means no headless test reaches the
        # changed code, which is a pass, not a failure.
        run: |
          rc=0; python -m pytest -q -rfE -o faulthandler_timeout=300 -p no:cacheprovider $SELECT $(cat headless.txt) || rc=$?
          if [ "$rc" -eq 5 ]; then echo "no test reaches the changed code"; exit 0; fi; exit $rc
      - name: Qt-only gate (offscreen)
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        # verbose on Windows, where a native crash ended the gate with no traceback: the last name printed is it
        run: |
          rc=0; python -m pytest ${{ runner.os == 'Windows' && '-v' || '-q' }} -rfE -o faulthandler_timeout=300 -p no:cacheprovider $SELECT $(cat qtonly.txt) || rc=$?
          if [ "$rc" -eq 5 ]; then echo "no test reaches the changed code"; exit 0; fi; exit $rc
      - name: Save the test selection database
        if: ${{ always() && github.event_name != 'schedule' && inputs.full != true }}
        uses: actions/cache/save@v4
        with:
          path: .testmondata
          key: testmon-${{ runner.os }}-${{ github.sha }}

  lint-imports:
    name: layering gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[fast,io,dev]"
      - name: Import contracts
        run: lint-imports

  pyvista:
    # The scene tests: pyvista's teardown segfaults on some machines, so this job may fail without
    # failing the run; it exists so those tests run somewhere and their result is visible.
    name: pyvista scene tests (allowed to fail)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    env:
      PYTHONNOUSERSITE: "1"
      QT_QPA_PLATFORM: offscreen
      # FFTW plans by estimate on the runners: pyfftw's default FFTW_MEASURE timed one M-Z reconstruction
      # test's plans for over five minutes on Windows and the headless gate past its limit. The engine
      # records the planner in every result, and the backends agree to float32 tolerance either way.
      PYFFTW_PLANNER_EFFORT: FFTW_ESTIMATE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Software OpenGL for VTK on Windows (Mesa3D)
        # GitHub's Windows runners have no GPU driver: a VTK render window crashed with an access
        # violation. The action installs Mesa's off-screen renderer and points VTK at it.
        if: runner.os == 'Windows'
        uses: pyvista/setup-headless-display-action@v5
      - name: Linux libraries Qt and VTK load even offscreen
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libglib2.0-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xkb1 libxcb-render-util0 libxcb-image0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[fast,io,app,dev]"
      - name: Scene tests (the pyvista marker)
        run: python -m pytest -q -p no:cacheprovider -m pyvista tests

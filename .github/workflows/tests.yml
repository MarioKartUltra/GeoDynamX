# The two test gates on the three targets: the mlx engine on Apple Silicon (macos-14 runners are
# arm64), FFTW3 on Windows and on Linux. The gates are the ones docs describe for a developer's
# machine: the headless set (no Qt, no pyvista) and the Qt-only set under the offscreen platform;
# full pytest is left out because pyvista's teardown segfaults.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    env:
      PYTHONNOUSERSITE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Linux libraries Qt and VTK load even offscreen
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libglib2.0-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xkb1 libxcb-render-util0 libxcb-image0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[app,dev]"
      - name: Engine in use
        run: python -c "from dynamix.core import fft_policy as p; print(p.resolve())"
      - name: Headless gate
        run: python -m pytest -q -p no:cacheprovider $(grep -L "pyvista\|QtWidgets\|qtbot" tests/test_*.py)
      - name: Qt-only gate (offscreen)
        run: python -m pytest -q -p no:cacheprovider $(grep -l "QtWidgets\|qtbot" tests/test_*.py | xargs grep -L "pyvista")
